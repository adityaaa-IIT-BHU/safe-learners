# Runs on every push and pull request: type checks, unit tests and a build of the web app and
# backend, then the end-to-end suites against the local Firebase emulators (test accounts only, no
# real project or data). The documents suite needs live OCR access, so it is run locally instead.
name: CI

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install
        run: |
          npm ci --prefix web
          npm ci --prefix backend
      - name: Backend type check and unit tests
        run: |
          cd backend && npx tsc --noEmit && npm test
      - name: Web type check, unit tests and build
        run: |
          cd web && npx tsc -b && npx vitest run && npm run build

  e2e:
    runs-on: ubuntu-latest
    needs: checks
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Install
        run: |
          npm ci --prefix backend
          npm install -g firebase-tools@15
      - name: Test-only emulator settings
        run: |
          printf 'SUPER_ADMIN_EMAILS=super.admin@test.local\nADMIN_EMAILS=legacy.admin@test.local\nAPP_URL=http://localhost:5173\n' > backend/.env.local
      - name: Build backend
        run: npm --prefix backend run build
      - name: End-to-end suites (emulators)
        run: firebase emulators:exec --project demo-safelearners --config firebase.emulator.json "node e2e/run-all.mjs"
      - name: Keep results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-results
          path: e2e/results/
          if-no-files-found: ignore
